<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Tattoo Studio | Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#0f0f0f;
    color:#fff;
}

/* DEMO BADGE */
.demo-badge{
    position:fixed;
    top:80px;
    right:20px;
    background:#fff;
    color:#000;
    padding:8px 15px;
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
    z-index:2000;
}

header{
    position:fixed;
    width:100%;
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    z-index:1000;
}

header h1{
    font-weight:700;
    letter-spacing:2px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin-left:30px;
    font-weight:300;
    transition:0.3s;
}

nav a:hover{
    color:#aaa;
}

.hero{
    height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:url('images/hero.jpg') center center no-repeat;
    background-size:cover;
}

.hero::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h2{
    font-size:50px;
    font-weight:700;
}

.hero p{
    margin-top:15px;
    font-weight:300;
    letter-spacing:1px;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    border:1px solid #fff;
    text-decoration:none;
    color:#fff;
    transition:0.3s;
}

.btn:hover{
    background:#fff;
    color:#000;
}

.section{
    padding:100px 10%;
    text-align:center;
}

.section h2{
    margin-bottom:50px;
    font-size:32px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:350px;
    object-fit:cover;
    transition:0.4s;
}

.gallery img:hover{
    transform:scale(1.05);
}

.contact{
    background:#111;
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
    color:#777;
    font-size:14px;
}

footer span{
    color:#fff;
    font-weight:500;
}
</style>
</head>

<body>

<div class="demo-badge">DEMO WEBSITE</div>

<header>
    <h1>MONSTER TATTOO</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <div class="hero-content">
        <h2>Ink Your Story</h2>
        <p>Premium Custom Tattoo Studio</p>
        <a href="#contact" class="btn">Book Appointment</a>
    </div>
</section>

<section class="section" id="gallery">
    <h2>Our Work</h2>
    <div class="gallery">
        <img src="images/tattoo1.jpg" alt="">
        <img src="images/tattoo2.jpg" alt="">
        <img src="images/tattoo3.jpg" alt="">
        <img src="images/tattoo4.jpg" alt="">
    </div>
</section>

<section class="section contact" id="contact">
    <h2>Contact Us</h2>
    <p>DM on Instagram for Bookings</p>
    <a href="https://www.instagram.com/m_o_n_s_t_e_r_tattoo/" target="_blank" class="btn">Visit Instagram</a>
</section>

<footer>
    © 2026 Monster Tattoo Studio | Demo Project <br>
    Website Designed & Developed by <span>EtihaZ Digital</span>
</footer>

</body>
</html>
